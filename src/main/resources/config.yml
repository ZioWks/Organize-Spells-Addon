gui:
  title: "&1Organiser les sorts"
  items:
    spell:
      material: ENCHANTED_BOOK
      name: "&f{spell}"
      selected-status: "&aSélectionné"
      unselected-status: "&7Position {position}"
      lore:
        - "{status}"
        - "&eClique sur deux sorts pour échanger leurs places."
    previous:
      material: ARROW
    previous-page:
      name: "&ePage précédente"
      lore: []
    next:
      material: ARROW
    next-page:
      name: "&ePage suivante"
      lore: []
    page:
      material: BOOK
      name: "&6Page {page}/{pages}"
      lore: []