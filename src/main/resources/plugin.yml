name: OrganiseSpells
main: organisespells.karmaaa.Plugin
version: 1.0
api-version: '1.21'
author: Karmaaa
depend: [MagicSpells]
commands:
  org:
    description: Affiche et réorganise les sorts liés à l'objet tenu.
    usage: /org [reload]
    permission: organisespells.command.org
permissions:
  organisespells.command.org:
    description: Permet d'ouvrir le menu d'organisation des sorts.
    default: op
  organisespells.command.reload:
    description: Permet de recharger la configuration d'OrganiseSpells.
    default: op